[platformio]
boards_dir = boards

; ── Native unit-test environment (no hardware needed) ────────────────────────
; Compiles es_detect.h's pure OUI/SSID/BLE-name pattern tables + matching
; helpers against the host GCC/Clang and runs Unity tests. Mirrors the
; equivalent [env:native] setup in the sibling flock-you-esp32 project.
;   pio test -e native                            # run all test suites
;   pio test -e native -f test_oui_matching        # OUI table matching
;   pio test -e native -f test_ssid_ble_matching   # SSID/BLE-name matching
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -D_GNU_SOURCE
build_src_filter = -<*>

[env:atom-lite]

platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = +<main.cpp>

