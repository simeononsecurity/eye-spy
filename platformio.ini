; ── LILYGO T-Dongle C5 (ESP32-C5, dual-band WiFi 6, BT5, 16MB flash) ─────────
; USB-C dongle · serial-only output (no NeoPixel; LED is plain GPIO8)
; Uses custom board JSON: boards/lilygo-t-dongle-c5.json
[env:lilygo-t-dongle-c5]
platform = espressif32@6.7.0
board = lilygo-t-dongle-c5
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit NeoPixel@^1.15.1
build_flags = -DCORE_DEBUG_LEVEL=0 -DT_DONGLE_C5 -DESP32C5_DUALBAND=1 -DUSE_C5_DISPLAY=1
build_src_filter = +<main.cpp>

; ── Atom Lite beacon-tester firmware ─────────────────────────────────────────
; Standalone, separate .cpp entry point (es_beacon_test.cpp) that broadcasts
; all 21 rotating detection scenarios + a periodic persist-engine scenario,
; for testing against a SECOND board running the real [env:atom-lite]/[env:*-ble]
; detector firmware. See es_beacon_test.cpp's file-header comment for full
; scenario list and usage (mirrors flock-you-esp32's beacon_test.cpp pattern).
; Do NOT flash this to a device you intend to use as a real detector.
[env:atom-lite-beacon]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = +<es_beacon_test.cpp> -<main.cpp>
