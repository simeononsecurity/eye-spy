[platformio]
boards_dir = boards

[env:atom-lite]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0

[env:atom-echo]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DATOM_ECHO

[env:atom-voice]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
    m5stack/M5Unified @ ^0.2.2
build_flags = -DCORE_DEBUG_LEVEL=0 -DATOM_VOICE

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DDEVKIT_LED

; ── M5Stack Basic Core v2.7 (ESP32-D0WDQ6-V3, ILI9342C 320x240, 1W speaker) ──
; 16MB flash · 320×240 IPS · 3 buttons A/B/C · 110mAh battery · IP5306 PMIC
; Buttons: [A] reset score  [B] cycle brightness  [C] force scan restart
[env:m5stack-basic]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DUSE_M5BASIC

; ── M5Stack Basic Core v2.7 + BLE coexistence ────────────────────────────────
[env:m5stack-basic-ble]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DUSE_M5BASIC -DENABLE_BLE_SCAN=1 -DBLE_COEX_MODE=1

; ── M5Stack Core2 For AWS v1.3 (ESP32-D0WDQ6-V3, 16MB flash, 8MB PSRAM) ──────
; Same ILI9342C 320×240 display as Basic — reuses m5basic_display.h via alias.
; Touch virtual buttons via FT6336U; I2S speaker NS4168.
[env:m5stack-core2-aws]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_HAS_PSRAM -DUSE_M5CORE2_AWS

; ── M5Stack Core2 For AWS v1.3 + BLE coexistence ─────────────────────────────
[env:m5stack-core2-aws-ble]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_HAS_PSRAM -DUSE_M5CORE2_AWS -DENABLE_BLE_SCAN=1 -DBLE_COEX_MODE=1

; ── M5StickC Plus SE (ESP32-PICO-D4, ST7789v2 135×240, passive buzzer G2) ─────
; 1.14" landscape display. Buttons A=G37 B=G39.  FTDI USB.
; [A] reset score  [B] force scan restart
[env:m5stickc-plus-se]
platform = espressif32@6.7.0
board = m5stick-c-plus
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DUSE_M5STICKC_PLUS_SE

; ── M5StickC Plus SE + BLE coexistence ───────────────────────────────────────
[env:m5stickc-plus-se-ble]
platform = espressif32@6.7.0
board = m5stick-c-plus
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DUSE_M5STICKC_PLUS_SE -DENABLE_BLE_SCAN=1 -DBLE_COEX_MODE=1

; ── LILYGO T-Dongle C5 (ESP32-C5, dual-band WiFi 6, BT5, 16MB flash) ─────────
; USB-C dongle · serial-only output (no NeoPixel; LED is plain GPIO8)
; Uses custom board JSON: boards/lilygo-t-dongle-c5.json
[env:lilygo-t-dongle-c5]
platform = espressif32@6.7.0
board = lilygo-t-dongle-c5
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit NeoPixel@^1.15.1
build_flags = -DCORE_DEBUG_LEVEL=0 -DT_DONGLE_C5 -DESP32C5_DUALBAND=1 -DUSE_C5_DISPLAY=1
