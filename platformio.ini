; ── M5Stack Basic Core v2.7 (ESP32-D0WDQ6-V3, ILI9342C 320x240, 1W speaker) ──
; 16MB flash · 320×240 IPS · 3 buttons A/B/C · 110mAh battery · IP5306 PMIC
; Buttons: [A] reset score  [B] cycle brightness  [C] force scan restart
[env:m5stack-basic]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DUSE_M5BASIC
build_src_filter = +<main.cpp>

; ── M5Stack Basic Core v2.7 + BLE coexistence ────────────────────────────────
[env:m5stack-basic-ble]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DUSE_M5BASIC -DENABLE_BLE_SCAN=1 -DBLE_COEX_MODE=1
build_src_filter = +<main.cpp>

; ── M5Stack Core2 For AWS v1.3 (ESP32-D0WDQ6-V3, 16MB flash, 8MB PSRAM) ──────
; Same ILI9342C 320×240 display as Basic — reuses m5basic_display.h via alias.
; Touch virtual buttons via FT6336U; I2S speaker NS4168.
[env:m5stack-core2-aws]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
; CP2104 + AXP192 reset: 921600 causes "Serial data stream stopped" on some units.
upload_speed = 460800
; NOTE: upload_flags is a *list* — each esptool argument/value must be on its
; own line.  A single-line "--before default_reset --after hard_reset" gets
; passed to esptool.py as ONE argument, producing:
;   esptool: error: argument operation: invalid choice: '--before default_reset --after hard_reset'
upload_flags =
    --before
    default_reset
    --after
    hard_reset
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_HAS_PSRAM -DUSE_M5CORE2_AWS
build_src_filter = +<main.cpp>

; ── M5Stack Core2 For AWS v1.3 + BLE coexistence ─────────────────────────────
[env:m5stack-core2-aws-ble]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
upload_speed = 460800
upload_flags =
    --before
    default_reset
    --after
    hard_reset

board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_HAS_PSRAM -DUSE_M5CORE2_AWS -DENABLE_BLE_SCAN=1 -DBLE_COEX_MODE=1
build_src_filter = +<main.cpp>

