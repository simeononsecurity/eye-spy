[platformio]
boards_dir = boards

[env:atom-lite]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0

[env:atom-echo]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.partitions = partitions_4mb.csv
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DATOM_ECHO

[env:atom-voice]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
    m5stack/M5Unified @ ^0.2.2
build_flags = -DCORE_DEBUG_LEVEL=0 -DATOM_VOICE

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_4mb.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0 -DDEVKIT_LED

; ── LILYGO T-Dongle C5 (ESP32-C5, dual-band WiFi 6, BT5, 16MB flash) ─────────
; USB-C dongle · serial-only output (no NeoPixel; LED is plain GPIO8)
; Uses custom board JSON: boards/lilygo-t-dongle-c5.json
[env:lilygo-t-dongle-c5]
platform = espressif32@6.7.0
board = lilygo-t-dongle-c5
framework = arduino
board_build.partitions = partitions_4mb.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit NeoPixel@^1.15.1
build_flags = -DCORE_DEBUG_LEVEL=0 -DT_DONGLE_C5 -DESP32C5_DUALBAND=1 -DUSE_C5_DISPLAY=1
