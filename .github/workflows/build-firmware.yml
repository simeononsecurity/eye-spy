name: Build Firmware & Deploy Web Flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          # No restore-keys -- prevents stale partial-platform caches

      - name: Install PlatformIO & esptool
        run: pip install platformio esptool

      # Build experimental C5 first (separate invocation, non-blocking).
      # Each pio run call cleans .pio/build/ on start, so C5 runs alone first;
      # any wipe it triggers is harmless since nothing else has been built yet.
      - name: Build lilygo-t-dongle-c5 (experimental)
        continue-on-error: true
        run: pio run -e lilygo-t-dongle-c5

      # Build ALL required environments in ONE pio run invocation.
      # A single invocation only cleans once at start, then builds each env
      # sequentially -- so all four firmware.bin files survive together.
      - name: Build all required environments
        run: >
          pio run
          -e atom-lite
          -e atom-echo
          -e atom-voice
          -e esp32dev
          -e m5stack-basic
          -e m5stack-core2-aws
          -e m5stickc-plus-se

      # Verify required build artifacts
      - name: Verify build artifacts
        run: |
          echo "=== Build directory contents ==="
          find .pio/build -name "firmware.bin" 2>/dev/null | sort
          echo "--- directories ---"
          ls -la .pio/build/ 2>/dev/null || echo "WARNING: .pio/build missing or empty"

          # Required envs - failure here blocks deploy
          for env in atom-lite atom-echo atom-voice esp32dev m5stack-basic m5stack-core2-aws m5stickc-plus-se; do
            if [ -f ".pio/build/$env/firmware.bin" ]; then
              echo "OK $env: $(du -sh .pio/build/$env/firmware.bin | cut -f1)"
            else
              echo "FAIL $env: firmware.bin MISSING"
              ls -la ".pio/build/$env/" 2>/dev/null || echo "  (build dir does not exist)"
              exit 1
            fi
          done

          # Optional C5 env - advisory only
          if [ -f ".pio/build/lilygo-t-dongle-c5/firmware.bin" ]; then
            echo "OK lilygo-t-dongle-c5: $(du -sh .pio/build/lilygo-t-dongle-c5/firmware.bin | cut -f1)"
          else
            echo "WARN lilygo-t-dongle-c5: not built (ESP32-C5 experimental - skipping)"
          fi

      # Assemble site
      - name: Prepare firmware directories
        run: |
          set -e
          mkdir -p site/firmware

          # Find boot_app0.bin from installed Arduino framework
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" 2>/dev/null | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin not found in PlatformIO packages"
            exit 1
          fi
          echo "Found boot_app0.bin at: $BOOT_APP0"

          # Required environments
          for env in atom-lite atom-echo atom-voice esp32dev m5stack-basic m5stack-core2-aws m5stickc-plus-se; do
            mkdir -p site/firmware/$env
            cp .pio/build/$env/firmware.bin   site/firmware/$env/
            cp .pio/build/$env/bootloader.bin site/firmware/$env/
            cp .pio/build/$env/partitions.bin site/firmware/$env/
            cp "$BOOT_APP0"                   site/firmware/$env/boot_app0.bin
            echo "Copied $env ($(du -sh site/firmware/$env/firmware.bin | cut -f1))"
          done

          # LILYGO T-Dongle C5 (optional -- only copy if build succeeded)
          if [ -f ".pio/build/lilygo-t-dongle-c5/firmware.bin" ]; then
            mkdir -p site/firmware/lilygo-t-dongle-c5
            cp .pio/build/lilygo-t-dongle-c5/firmware.bin   site/firmware/lilygo-t-dongle-c5/
            cp .pio/build/lilygo-t-dongle-c5/bootloader.bin site/firmware/lilygo-t-dongle-c5/
            cp .pio/build/lilygo-t-dongle-c5/partitions.bin site/firmware/lilygo-t-dongle-c5/
            cp "$BOOT_APP0"                                  site/firmware/lilygo-t-dongle-c5/boot_app0.bin
            echo "Copied lilygo-t-dongle-c5"
          else
            echo "WARN lilygo-t-dongle-c5 build not found -- skipping firmware copy"
          fi

      - name: Generate manifests
        run: |
          set -e

          gen_manifest() {
            local env=$1
            local name=$2
            cat > site/manifest-${env}.json << MANIFEST
          {
            "name": "${name}",
            "version": "latest",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "firmware/${env}/bootloader.bin", "offset": 4096 },
                  { "path": "firmware/${env}/partitions.bin", "offset": 32768 },
                  { "path": "firmware/${env}/boot_app0.bin",  "offset": 57344 },
                  { "path": "firmware/${env}/firmware.bin",   "offset": 65536 }
                ]
              }
            ]
          }
          MANIFEST
          }

          gen_manifest "atom-lite"          "Eye Spy -- M5Atom Lite"
          gen_manifest "atom-echo"          "Eye Spy -- M5Atom Echo"
          gen_manifest "atom-voice"         "Eye Spy -- M5Atom Voice"
          gen_manifest "esp32dev"           "Eye Spy -- Generic ESP32 DevKit"
          gen_manifest "m5stack-basic"      "Eye Spy -- M5Stack Basic Core v2.7"
          gen_manifest "m5stack-core2-aws"  "Eye Spy -- M5Stack Core2 For AWS"
          gen_manifest "m5stickc-plus-se"   "Eye Spy -- M5StickC Plus SE"

          # ESP32-C5 manifest -- only generate if firmware was built
          if [ -d "site/firmware/lilygo-t-dongle-c5" ]; then
            cat > site/manifest-lilygo-t-dongle-c5.json << MANIFEST
          {
            "name": "Eye Spy -- LILYGO T-Dongle C5 (ESP32-C5)",
            "version": "latest",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-C5",
                "parts": [
                  { "path": "firmware/lilygo-t-dongle-c5/bootloader.bin", "offset": 0 },
                  { "path": "firmware/lilygo-t-dongle-c5/partitions.bin", "offset": 32768 },
                  { "path": "firmware/lilygo-t-dongle-c5/boot_app0.bin",  "offset": 57344 },
                  { "path": "firmware/lilygo-t-dongle-c5/firmware.bin",   "offset": 65536 }
                ]
              }
            ]
          }
          MANIFEST
            echo "Generated manifest-lilygo-t-dongle-c5.json"
          else
            echo "WARN Skipping C5 manifest (firmware not built)"
          fi

          echo "Manifests generated:"
          ls -la site/manifest-*.json

      - name: Copy flasher page
        run: cp docs/index.html site/index.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
          commit-message: "ci: deploy firmware build ${{ github.sha }}"
